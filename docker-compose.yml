name: ai-trading-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crypto_platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:4.8.1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8080:8080"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform_dev}@postgres:5432/${POSTGRES_DB:-crypto_platform}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL: ${SESSION_TTL:-86400}
      REMEMBER_ME_TTL: ${REMEMBER_ME_TTL:-2592000}
      SESSION_FINGERPRINT_ENABLED: ${SESSION_FINGERPRINT_ENABLED:-true}
      SESSION_FINGERPRINT_BIND_IP: ${SESSION_FINGERPRINT_BIND_IP:-false}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      WEB_APP_URL: ${WEB_APP_URL:-http://localhost:3000}
      PASSWORD_BREACH_CHECK_ENABLED: ${PASSWORD_BREACH_CHECK_ENABLED:-false}
      TOTP_REQUIRED_FOR_SENSITIVE_ACTIONS: ${TOTP_REQUIRED_FOR_SENSITIVE_ACTIONS:-false}
      BINANCE_FUTURES_BASE_URL: ${BINANCE_FUTURES_BASE_URL:-https://fapi.binance.com}
      BINANCE_FUTURES_TESTNET_BASE_URL: ${BINANCE_FUTURES_TESTNET_BASE_URL:-https://testnet.binancefuture.com}
      OKX_BASE_URL: ${OKX_BASE_URL:-https://www.okx.com}
      OKX_DEMO_TRADING_ENABLED: ${OKX_DEMO_TRADING_ENABLED:-true}
      OKX_WS_PUBLIC_URL: ${OKX_WS_PUBLIC_URL:-wss://ws.okx.com:8443/ws/v5/public}
      OKX_WS_BUSINESS_URL: ${OKX_WS_BUSINESS_URL:-wss://ws.okx.com:8443/ws/v5/business}
      EXCHANGE_HTTP_TIMEOUT_MS: ${EXCHANGE_HTTP_TIMEOUT_MS:-10000}
      EXCHANGE_MAX_RETRIES: ${EXCHANGE_MAX_RETRIES:-2}
      EXCHANGE_RETRY_BASE_DELAY_MS: ${EXCHANGE_RETRY_BASE_DELAY_MS:-300}
      EXCHANGE_PUBLIC_RATE_LIMIT_ENABLED: ${EXCHANGE_PUBLIC_RATE_LIMIT_ENABLED:-true}
      EXCHANGE_PRIVATE_RATE_LIMIT_ENABLED: ${EXCHANGE_PRIVATE_RATE_LIMIT_ENABLED:-true}
      EXCHANGE_PUBLIC_RATE_LIMIT_PER_MINUTE: ${EXCHANGE_PUBLIC_RATE_LIMIT_PER_MINUTE:-1200}
      EXCHANGE_PRIVATE_RATE_LIMIT_PER_MINUTE: ${EXCHANGE_PRIVATE_RATE_LIMIT_PER_MINUTE:-1200}
      EXCHANGE_INSTRUMENT_CACHE_TTL_SECONDS: ${EXCHANGE_INSTRUMENT_CACHE_TTL_SECONDS:-3600}
      EXCHANGE_TICKER_CACHE_TTL_SECONDS: ${EXCHANGE_TICKER_CACHE_TTL_SECONDS:-3}
      EXCHANGE_TIME_OFFSET_CACHE_TTL_SECONDS: ${EXCHANGE_TIME_OFFSET_CACHE_TTL_SECONDS:-300}
      EXCHANGE_PRODUCTION_CONNECTIONS_ENABLED: ${EXCHANGE_PRODUCTION_CONNECTIONS_ENABLED:-false}
      EXCHANGE_REQUIRE_RECENT_AUTH: ${EXCHANGE_REQUIRE_RECENT_AUTH:-true}
      EXCHANGE_RECENT_AUTH_TTL_SECONDS: ${EXCHANGE_RECENT_AUTH_TTL_SECONDS:-600}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-GEMINI}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gemini-3.1-flash-lite}
      DEFAULT_MAX_TOKENS: ${DEFAULT_MAX_TOKENS:-2048}
      DEFAULT_TEMPERATURE: ${DEFAULT_TEMPERATURE:-0.7}
      AGENT_FRAMEWORK_ENABLED: ${AGENT_FRAMEWORK_ENABLED:-true}
      AGENT_MANUAL_RUN_ENABLED: ${AGENT_MANUAL_RUN_ENABLED:-true}
      AGENT_SYSTEM_DIAGNOSTIC_ENABLED: ${AGENT_SYSTEM_DIAGNOSTIC_ENABLED:-true}
      AGENT_DEFAULT_TIMEOUT_MS: ${AGENT_DEFAULT_TIMEOUT_MS:-60000}
      AGENT_MAX_GLOBAL_CONCURRENCY: ${AGENT_MAX_GLOBAL_CONCURRENCY:-10}
      AGENT_MAX_USER_CONCURRENCY: ${AGENT_MAX_USER_CONCURRENCY:-10}
      AGENT_MAX_TYPE_CONCURRENCY: ${AGENT_MAX_TYPE_CONCURRENCY:-5}
      AGENT_MAX_RUNS_PER_MINUTE: ${AGENT_MAX_RUNS_PER_MINUTE:-30}
      AGENT_MAX_RUNS_PER_HOUR: ${AGENT_MAX_RUNS_PER_HOUR:-500}
      AGENT_MAX_RUNS_PER_DAY: ${AGENT_MAX_RUNS_PER_DAY:-5000}
      AGENT_MAX_RETRY_ATTEMPTS: ${AGENT_MAX_RETRY_ATTEMPTS:-2}
      AGENT_IDEMPOTENCY_TTL_SECONDS: ${AGENT_IDEMPOTENCY_TTL_SECONDS:-60}
      AGENT_RUN_RETENTION_DAYS: ${AGENT_RUN_RETENTION_DAYS:-90}
      PIPELINE_ENABLED: ${PIPELINE_ENABLED:-true}
      PIPELINE_MAX_CONCURRENCY: ${PIPELINE_MAX_CONCURRENCY:-5}
      PIPELINE_COOLDOWN_MS: ${PIPELINE_COOLDOWN_MS:-60000}
      PIPELINE_MAX_RUNS_PER_HOUR: ${PIPELINE_MAX_RUNS_PER_HOUR:-60}
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-60}
      TRADING_MODE: ${TRADING_MODE:-DEMO}
      GLOBAL_TRADING_ENABLED: ${GLOBAL_TRADING_ENABLED:-true}
      LIVE_TRADING_ENABLED: ${LIVE_TRADING_ENABLED:-false}
      LIVE_POSITION_SYNC_ENABLED: ${LIVE_POSITION_SYNC_ENABLED:-true}
      LIVE_POSITION_SYNC_INTERVAL_MS: ${LIVE_POSITION_SYNC_INTERVAL_MS:-30000}
      LIVE_RISK_APPROVAL_TTL_MS: ${LIVE_RISK_APPROVAL_TTL_MS:-300000}
      RISK_PER_TRADE: ${RISK_PER_TRADE:-0.02}
      DEFAULT_LEVERAGE: ${DEFAULT_LEVERAGE:-3}
      TRADE_COOLDOWN_MS: ${TRADE_COOLDOWN_MS:-60000}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:-0.02}
      TAKE_PROFIT_PCT: ${TAKE_PROFIT_PCT:-0.04}
      MAX_POSITIONS: ${MAX_POSITIONS:-3}
      MAX_LEVERAGE: ${MAX_LEVERAGE:-3}
      MAX_DRAWDOWN: ${MAX_DRAWDOWN:-0.15}
      MAX_EXPOSURE: ${MAX_EXPOSURE:-0.6}
      RISK_REWARD_RATIO: ${RISK_REWARD_RATIO:-2}
      HIGH_VOLATILITY_THRESHOLD: ${HIGH_VOLATILITY_THRESHOLD:-0.04}
      ABNORMAL_VOLATILITY_THRESHOLD: ${ABNORMAL_VOLATILITY_THRESHOLD:-0.15}
      HIGH_VOLATILITY_SIZE_FACTOR: ${HIGH_VOLATILITY_SIZE_FACTOR:-0.6}
      MAX_STRATEGIES: ${MAX_STRATEGIES:-5}
      MAX_TOTAL_EXPOSURE: ${MAX_TOTAL_EXPOSURE:-0.6}
      MAX_STRATEGY_EXPOSURE: ${MAX_STRATEGY_EXPOSURE:-0.25}
      MAX_DRAWDOWN_PORTFOLIO: ${MAX_DRAWDOWN_PORTFOLIO:-0.2}
      STRATEGY_DISABLE_MIN_TRADES: ${STRATEGY_DISABLE_MIN_TRADES:-10}
      STRATEGY_DISABLE_RETURN_PCT: ${STRATEGY_DISABLE_RETURN_PCT:--0.1}
      STRATEGY_DISABLE_WIN_RATE: ${STRATEGY_DISABLE_WIN_RATE:-0.35}
      PORTFOLIO_REBALANCE_INTERVAL_MS: ${PORTFOLIO_REBALANCE_INTERVAL_MS:-3600000}
    ports:
      - "3001:3001"
    command:
      [
        "sh",
        "-c",
        "pnpm --filter @platform/api db:migrate && pnpm --filter @platform/api start",
      ]
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/api/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
