name: Deploy to GCP VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USERNAME }}
          key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
          port: 22
          envs: GH_TOKEN
          script_stop: true
          script: |
            set -e

            DEPLOY_DIR="/home/vietluu24012001/AI-trading-agents"
            if [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/AI-trading-agents"
            fi
            echo "Deploying in: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            # 1. Pull code mới nhất bằng GitHub Token (hỗ trợ private repo)
            git fetch https://x-access-token:${GH_TOKEN}@github.com/vietluu/AI-trading-agents.git main
            git merge FETCH_HEAD --no-edit

            # 2. Tái build và cập nhật api & web (giữ nguyên database và redis)
            if docker compose version >/dev/null 2>&1; then
              docker compose up -d --build api web
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose up -d --build api web
            fi

            echo "Deployment completed successfully!"
