name: Deploy to GCP VM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare lowercase repo name
        id: repo_name
        run: |
          echo "repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repo }}-api:latest
            ghcr.io/${{ steps.repo_name.outputs.repo }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || '' }}
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repo }}-web:latest
            ghcr.io/${{ steps.repo_name.outputs.repo }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        id: validate_secrets
        shell: bash
        env:
          GCP_VM_IP: ${{ secrets.GCP_VM_IP }}
          GCP_VM_USERNAME: ${{ secrets.GCP_VM_USERNAME }}
          GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for name in GCP_VM_IP GCP_VM_USERNAME GCP_SSH_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: ${name}"
              exit 1
            fi
          done

          VM_IP="$(printf '%s' "$GCP_VM_IP" | tr -d '\r\n')"
          VM_USERNAME="$(printf '%s' "$GCP_VM_USERNAME" | tr -d '\r\n')"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$GCP_SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/gcp_vm_key
          chmod 600 ~/.ssh/gcp_vm_key
          ssh-keygen -y -f ~/.ssh/gcp_vm_key >/dev/null
          ssh-keyscan -H "$VM_IP" >> ~/.ssh/known_hosts 2>/dev/null || true

          {
            echo "vm_ip=${VM_IP}"
            echo "vm_username=${VM_USERNAME}"
            echo "ssh_key_path=${HOME}/.ssh/gcp_vm_key"
          } >> "$GITHUB_OUTPUT"

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ steps.validate_secrets.outputs.vm_ip }}
          username: ${{ steps.validate_secrets.outputs.vm_username }}
          key_path: ${{ steps.validate_secrets.outputs.ssh_key_path }}
          port: 22
          envs: GH_TOKEN,GH_ACTOR
          script: |
            set -euo pipefail

            DEPLOY_DIR="/home/vietluu24012001/AI-trading-agents"
            if [ ! -d "$DEPLOY_DIR" ]; then
              DEPLOY_DIR="$HOME/AI-trading-agents"
            fi
            echo "Deploying in: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            git fetch https://x-access-token:${GH_TOKEN}@github.com/vietluu/AI-trading-agents.git main
            git reset --hard FETCH_HEAD

            # Authenticate Docker to GitHub Container Registry
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            # Pull pre-built images from GHCR and restart services
            if docker compose version >/dev/null 2>&1; then
              docker compose pull api web
              docker compose up -d api web
              docker image prune -f
            elif command -v docker-compose >/dev/null 2>&1; then
              docker-compose pull api web
              docker-compose up -d api web
              docker image prune -f
            else
              echo "::error::Neither docker compose nor docker-compose is available on the VM."
              exit 1
            fi

            echo "Deployment completed successfully!"
