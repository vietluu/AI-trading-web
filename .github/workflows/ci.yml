name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crypto_platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform -d crypto_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      API_PORT: 3001
      DATABASE_URL: postgresql://platform:platform_dev@localhost:5432/crypto_platform?schema=public
      REDIS_URL: redis://localhost:6379
      CORS_ORIGINS: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      SESSION_TTL: 3600
      COOKIE_SECURE: "false"
      ENCRYPTION_MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Start API for integration tests
        run: |
          pnpm --filter @platform/api start > api.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3001/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat api.log
          exit 1

      - name: HTTP integration tests
        env:
          RUN_INTEGRATION_TESTS: "true"
        run: pnpm --filter @platform/api test
