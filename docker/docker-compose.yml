version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=******db:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../src:/app/src:ro
    networks:
      - trading-net

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A src.infrastructure.messaging.celery_app:celery_app worker --loglevel=info --concurrency=4
    environment:
      - APP_ENV=development
      - DATABASE_URL=******db:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ../.env
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - trading-net

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A src.infrastructure.messaging.celery_app:celery_app beat --loglevel=info
    environment:
      - APP_ENV=development
      - DATABASE_URL=******db:5432/trading_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - ../.env
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - trading-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trading_db
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_user -d trading_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trading-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - trading-net

volumes:
  postgres-data:
  redis-data:

networks:
  trading-net:
    driver: bridge
