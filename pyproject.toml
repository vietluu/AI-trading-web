[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-agents"
version = "0.1.0"
description = "Production-ready AI-powered cryptocurrency futures trading research platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "AI Trading Agents Team" }]

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    # Cache
    "redis[hiredis]>=5.0.6",
    # HTTP clients
    "httpx>=0.27.0",
    "aiohttp>=3.9.5",
    "websockets>=12.0",
    # Data processing
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "ta>=0.11.0",
    # AI / ML
    "openai>=1.35.0",
    "tiktoken>=0.7.0",
    # Task scheduling
    "celery[redis]>=5.4.0",
    "apscheduler>=3.10.4",
    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "cryptography>=42.0.8",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Monitoring
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "ruff>=0.4.10",
    "mypy>=1.10.0",
    "pre-commit>=3.7.1",
    "freezegun>=1.5.1",
    "respx>=0.21.1",
    "factory-boy>=3.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF012", "UP042", "RUF002", "SIM105", "C408"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=35"

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/tests/*"]
