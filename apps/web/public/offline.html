<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07111f" />
    <title>Đang ngoại tuyến | AI Trading Research</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #e8f1ff;
        background: radial-gradient(circle at top, #15365d, #07111f 55%);
      }
      main {
        width: min(100%, 520px);
        padding: 32px;
        border: 1px solid #29496f;
        border-radius: 20px;
        background: rgba(7, 17, 31, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .logo {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        margin-bottom: 24px;
        border-radius: 14px;
        background: #2e7cf6;
        font-weight: 900;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0 0 24px;
        color: #a9bad0;
        line-height: 1.6;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        color: white;
        background: #2e7cf6;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo" aria-hidden="true">AX</div>
      <h1>Không có kết nối mạng</h1>
      <p>
        Dữ liệu thị trường và lệnh giao dịch không được lưu cache. Hãy kết nối
        lại để xem thông tin realtime an toàn.
      </p>
      <button type="button" onclick="window.location.reload()">
        Thử kết nối lại
      </button>
    </main>
  </body>
</html>
